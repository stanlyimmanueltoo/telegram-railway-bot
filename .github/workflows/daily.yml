name: Daily Telegram Bot Run

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 12 * * *"   # Runs daily at 12:00 UTC (14:00 Netherlands)
    - cron: "0 20 * * *"   # 22:00 Netherlands
  workflow_dispatch:        # Allows manual run

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python3 main.py
